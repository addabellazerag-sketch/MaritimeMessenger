name: Build Maritime APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean Environment and Build
        run: |
          # مسح أي خيارات ذاكرة قديمة ومعطوبة من جميع ملفات المشروع
          find . -name "*.properties" -exec sed -i '/jvmargs/d' {} + || true
          find . -name "*.properties" -exec sed -i '/Xmx/d' {} + || true
          
          # تفريغ متغيرات البيئة تماماً
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          export JAVA_TOOL_OPTIONS=""
          export _JAVA_OPTIONS=""
          
          # تشغيل البناء مع تمرير ذاكرة نظيفة بدون علامات تنصيص مشوهة
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx2048m

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeMessenger-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
