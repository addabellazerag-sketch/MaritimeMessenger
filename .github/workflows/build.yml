name: Build Maritime APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - run: yes | sdkmanager --licenses || true

    -name: Build Maritime APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build with Gradle
      run: |
        gradle assembleDebug --stacktrace -x test -x lint -x lintVitalRelease

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MaritimeMessenger-Debug-APK
        path: "**/build/outputs/apk/**/*.apk"
        if-no-files-found: warn
