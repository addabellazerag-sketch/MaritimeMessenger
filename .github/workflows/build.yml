name: Build MaritimeMessenger APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      # 1. تحميل المشروع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. إعطاء صلاحية التنفيذ لـ Gradle
      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew غير موجود في جذر المشروع"
            exit 1
          fi

      # 4. تنظيف المشروع
      - name: Clean project
        run: ./gradlew clean

      # 5. بناء APK Debug
      - name: Build APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. البحث عن ملف APK
      - name: Find APK
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      # 7. رفع APK كـ Artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeMessenger-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
