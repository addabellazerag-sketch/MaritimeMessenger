name: Build Maritime APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Clean Memory Args and Build APK
        run: |
          # 1. إزالة أي سطر مشوه يحتوي على Xmx أو jvmargs من كافة ملفات الإعداد
          find . -name "*.properties" -exec sed -i '/jvmargs/d' {} + || true
          find . -name "*.properties" -exec sed -i '/Xmx/d' {} + || true
          
          # 2. تفريغ متغيرات البيئة المشوهة
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          export JAVA_TOOL_OPTIONS=""
          export _JAVA_OPTIONS=""

          # 3. تشغيل البناء الرسمي بذاكرة نظيفة
          gradle assembleDebug --no-daemon -org.gradle.jvmargs=-Xmx2048m -x lint -x test

      - name: Verify APK Output
        run: ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeMessenger-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
