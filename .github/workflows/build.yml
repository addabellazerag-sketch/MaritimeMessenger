إيه، الكود صحيح من ناحية YAML وGitHub Actions، بصح كاين نقطة مهمة: خطوة sed تقدر تمسح إعدادات من ملفات .properties بطريقة غير مرغوبة، وما تحتاجهاش غالبًا.
الأفضل تستعمل نسخة أنظف هكذا:
name: Build Maritime APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          unset JAVA_TOOL_OPTIONS
          unset _JAVA_OPTIONS
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeMessenger-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
مهم: هذا يفترض أن المشروع Android/Gradle فيه:
gradlew في جذر المشروع.
مجلد app.
الـ APK الناتج فعلًا في: app/build/outputs/apk/debug/app-debug.apk
إذا الخطأ اللي عندك هو JVM arguments أو Xmx، ابعثلي رسالة الخطأ كاملة من GitHub Actions ونصلحها بالضبط بدل ما نمسحو إعدادات المشروع عشوائيًا.
