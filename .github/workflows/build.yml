name: Build Maritime  APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on:ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Configure Gradle Properties and Memory
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError" >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

      - name: Accept Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace -x test -x lint

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaritimeMessenger-Debug-APK
          path: "**/build/outputs/apk/**/*.apk"
